image: alpine:latest

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push' # Only run pipelines on push events

pages:
  stage: deploy
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  script:
    - rm -rf public/
    - mkdir -p public
    - cp index.html public/
    - cp -r assets/ public/assets/
